backend: huggingface
task: INSTANCE_SEGMENTATION
model:
  class_path: getitune.backend.huggingface.models.instance_segmentation.HFInstSegModel
  init_args:
    checkpoint: tue-mps/eomt-dinov3-coco-instance-large-640
    pretrained: true
    input_size: [640, 640]
    resize_mode: standard
    onnx_dynamo: false
engine:
  device: auto
training:
  max_epochs: 30
  batch: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.00005
  precision: bf16-mixed
  patience: 10
  optim: adamw_torch
  weight_decay: 0.05
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
data: ../_base_/data/instance_segmentation_stretch.yaml

# Keep the data pipeline at the checkpoint's native 640x640 resolution
# (the shared data base defaults to 1024x1024).
overrides:
  data:
    input_size: [640, 640]
