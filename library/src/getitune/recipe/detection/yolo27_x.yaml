backend: ultralytics
task: DETECTION

model:
  class_path: getitune.backend.ultralytics.models.yolo_detr.UltralyticsYoloDetrModel
  init_args:
    model_name: yolo27x.pt
    pretrained: false
    imgsz: 640

engine:
  device: auto

training:
  epochs: 100
  batch: 4
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  warmup_epochs: 0.0
  backbone_lr_ratio: 0.1
  patience: 0

export:
  format: OPENVINO
  precision: FP32
  confidence_threshold: 0.5
  iou_threshold: 0.5

data: ../_base_/data/detection.yaml

overrides:
  data:
    input_size: [640, 640]
    train_subset:
      batch_size: 4
      num_workers: 4
      augmentations_cpu:
        - class_path: getitune.data.augmentation.transforms.Resize
          init_args:
            size: $(input_size)
            keep_aspect_ratio: false
        - class_path: torchvision.transforms.v2.RandomHorizontalFlip
          init_args:
            p: 0.5
      augmentations_gpu: []
      sampler:
        class_path: getitune.data.samplers.balanced_sampler.BalancedSampler
    val_subset:
      batch_size: 8
      num_workers: 4
      augmentations_cpu:
        - class_path: getitune.data.augmentation.transforms.Resize
          init_args:
            size: $(input_size)
            keep_aspect_ratio: false
      augmentations_gpu: []
      sampler:
        class_path: torch.utils.data.SequentialSampler
    test_subset:
      batch_size: 8
      num_workers: 4
      augmentations_cpu:
        - class_path: getitune.data.augmentation.transforms.Resize
          init_args:
            size: $(input_size)
            keep_aspect_ratio: false
      augmentations_gpu: []
      sampler:
        class_path: torch.utils.data.SequentialSampler