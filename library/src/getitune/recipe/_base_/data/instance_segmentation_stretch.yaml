task: INSTANCE_SEGMENTATION
input_size:
  - 1024
  - 1024
unannotated_items_ratio: 0.0

# Identical to instance_segmentation.yaml except that Resize does NOT preserve
# aspect ratio (plain stretch, no padding). Required by instance segmentation
# models whose exported mask grid spans the whole input canvas and whose
# ModelAPI decode (DETRInstSeg full-image masks) resizes that canvas straight
# back to the original size: with a letterbox the pad region would travel into
# the decoded mask, squashing/offsetting it (issue #7829). Consumers:
# eomt_large_640, eomt_dinov3_large_640, mask2former_swin_* (HF backend).
train_subset:
  subset_name: train
  batch_size: 8
  num_workers: 4
  augmentations_cpu:
    - class_path: getitune.data.augmentation.transforms.Resize
      init_args:
        size: $(input_size)
        keep_aspect_ratio: false
  augmentations_gpu:
    - class_path: kornia.augmentation.RandomHorizontalFlip
      init_args:
        p: 0.5
    - class_path: kornia.augmentation.Normalize
      init_args:
        mean:
          - 0.485
          - 0.456
          - 0.406
        std:
          - 0.229
          - 0.224
          - 0.225
  sampler:
    class_path: torch.utils.data.RandomSampler
    init_args: null

val_subset:
  subset_name: val
  batch_size: 8
  num_workers: 4
  augmentations_cpu:
    - class_path: getitune.data.augmentation.transforms.Resize
      init_args:
        size: $(input_size)
        keep_aspect_ratio: false
        resize_targets: false
  augmentations_gpu:
    - class_path: kornia.augmentation.Normalize
      init_args:
        mean:
          - 0.485
          - 0.456
          - 0.406
        std:
          - 0.229
          - 0.224
          - 0.225
  sampler:
    class_path: torch.utils.data.RandomSampler
    init_args: null

test_subset:
  subset_name: test
  batch_size: 8
  num_workers: 4
  augmentations_cpu:
    - class_path: getitune.data.augmentation.transforms.Resize
      init_args:
        size: $(input_size)
        keep_aspect_ratio: false
        resize_targets: false
  augmentations_gpu:
    - class_path: kornia.augmentation.Normalize
      init_args:
        mean:
          - 0.485
          - 0.456
          - 0.406
        std:
          - 0.229
          - 0.224
          - 0.225
  sampler:
    class_path: torch.utils.data.RandomSampler
    init_args: null
