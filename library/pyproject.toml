# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# SETUP CONFIGURATION.                                                        #
[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "getitune"
version = "0.3.0"
description = "getitune: Train, Evaluate, Optimize, Deploy Computer Vision Models"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
    { name = "Intel Corporation" },
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "datumaro[experimental]~=1.13.10",
    "omegaconf==2.3.0",
    "rich==14.0.0",
    "jsonargparse==4.35.0",
    "ftfy==6.3.1",
    "regex==2026.1.15",
    "importlib_resources==6.5.2",
    "docstring_parser==0.16", # CLI help-formatter
    "rich_argparse==1.7.0", # CLI help-formatter
    "einops==0.8.1",
    "typeguard>=4.3,<4.5",
    "lightning==2.6.0",
    "torchmetrics==1.8.2",
    "pytorchcv==0.0.74",
    "timm==1.0.28",
    "openvino~=2026.3.0",
    "openvino-model-api==0.4.7",
    "onnx==1.22.0",
    "onnxruntime==1.26.0",
    "onnxslim~=0.1.71",
    "onnxscript==0.6.2",
    "nncf~=3.0",
    "numpy>=2.0",
    "pyyaml==6.0.3",
    "tensorboard==2.20.0",
    "tensorboardx==2.6.4",
    "kornia~=0.8.2",
    "rfdetr==1.8.0",
    "certifi>=2026",
    "roboflow~=1.2",
]

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-stress",
    "pytest-html",
    "coverage",
    "pytest-timeout",
    "pytest-mock",
    "pytest-forked",
    "dill",
    "tifffile",
    "py-cpuinfo",
    "mlflow>=3.11.1",
]

lint = [
    "ruff==0.11.13",
    "attrs",
    "types-PyYAML~=6.0.12",
    "types-aiofiles",
    "types-requests~=2.32.4",
    "types-Deprecated",
    "types-docutils",
    "types_futures",
    "types-python-dateutil",
    "tokenize-rt==3.2.0",
    "pyrefly~=0.51.0",
]

[project.optional-dependencies]
cpu = [
    # Note: platform-specific wheels are only available for Linux and Windows.
    # For macOS, there is only one version of torch (default) available via PyPI.
    "torch==2.13.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision==0.27.1+cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.13.0; sys_platform != 'linux' and sys_platform != 'win32'",
    "torchvision==0.27.1 ; sys_platform != 'linux' and sys_platform != 'win32'"
]
cuda = [
    "torch==2.13.0",
    "torchvision==0.27.1+cu130"
]
xpu = [
    "torch==2.13.0",
    "triton-xpu==3.7.1",
    "torchvision==0.27.1+xpu"
]
ultralytics = [
    "ultralytics==8.4.86",
]

docs = [
    "furo",
    "myst-parser>=2.0.0",
    "sphinx==7.2.6",
    "pydata-sphinx-theme==0.12.0",
    "sphinx-tabs",
    "sphinx-panels",
    "sphinx-design",
    "sphinx-copybutton==0.5.2",
    "sphinx-autoapi",
    "sphinxemoji",
    "nbsphinx",
    "linkify-it-py",
]

ci_publish = [
    "build==1.2.2.post1",
]

benchmark = [
    "kagglehub>=0.4.1",
    "psutil>=6.0",
]

[project.scripts]
getitune = "getitune.cli:main"
otx = "getitune.cli:main"

[project.urls]
Documentation = "https://docs.geti.intel.com/docs/user-guide/library/get-started/intro"
Repository = "https://github.com/open-edge-platform/geti/"

[tool.uv]
default-groups = ["dev", "lint"]
required-version = "~=0.10.4"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "xpu" },
        { extra = "cuda" },
    ],
]
exclude-dependencies = [
    # We already depend on 'opencv-python-headless' through 'datumaro' and 'openvino-model-api', so installing
    # 'opencv-python' (the version with GUI dependencies) may cause conflicts and waste disk space.
    "opencv-python",
]
override-dependencies = [
    # Bypass the unnecessarily strict version requirement of 'opencv-python-headless' set by 'roboflow'
    "opencv-python-headless~=4.11",
    # mlflow caps pyarrow<24 but datumaro 2.0.0 requires pyarrow>=24; pyarrow 24.x works fine with mlflow
    "pyarrow>=24.0,<25",
    # roboflow hard-pins idna==3.7; allow newer versions
    "idna>=3.15",
    # torch==2.12.1 caps setuptools<82 but version lower than 83.0 have vulnerabilities of moderate severity
    "setuptools>=83.0",
]

[tool.uv.sources]
torch = [
    # Note: Pytorch indexes only provide pre-built wheels for Linux and Windows.
    # For other platforms (e.g., macOS), Pytorch has to be installed from the default PyPI index.
    { index = "torch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
    { index = "torch-xpu", extra = "xpu"},
    { index = "torch-cuda", extra = "cuda"},
]
triton-xpu = [
    { index = "torch-xpu", extra = "xpu"},
]
torchvision = [
    { index = "torch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
    { index = "torch-xpu", extra = "xpu"},
    { index = "torch-cuda", extra = "cuda"},
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["getitune*", "otx"]

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# COVERAGE CONFIGURATION.                                                     #
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
source = [
    "src/getitune/",
]
omit = [
    "**/__init__.py",
    "src/getitune/recipes/*",
    "src/getitune/tools/*",
    "**/exportable_code/*",
    "src/getitune/core/model/utils/*",

    # Ignore some generated files by opencv-python
    "config.py",
    "config-3.py",
]


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# RUFF CONFIGURATION                                                          #
[tool.ruff]

# Same as Black.
line-length = 120

# minimum target version
target-version = "py38"

# Enumerate all fixed violations.
show-fixes = true

# Allow imports relative to the "src" and "tests" directories.
src = ["src", "tests"]

[tool.ruff.lint]

# Enable rules
select = [
    "F",    # Pyflakes (`F`)

    # Enable all `pydocstyle` rules, limiting to those that adhere to the
    # Google convention via `convention = "google"`, below.
    "D",    # pydocstyle (`D`)
    "E",    # pycodestyle error (`E`)
    "W",    # pycodestyle warning (`W`)

    "I",    # isort (`I`)
    "PL",   # pylint (`PL`)

    "C90",  # mccabe (`C90`)
    "N",    # pep8-naming (`N`)
    "UP",   # pyupgrade (`UP`)

    "YTT",  # flake8-2020 (`YTT`)
    "ANN",  # flake8-annotations (`ANN`)
    "S",    # flake8-bandit (`S`)
    # "BLE",  # flake8-blind-except (`BLE`)  -> Need to discuss new exception structure
    "B",    # flake8-bugbear (`B`)
    "A",    # flake8-builtins (`A`)
    "COM",  # flake8-commas (`COM`)
    "C4",   # flake8-comprehensions (`C4`)
    "DTZ",  # flake8-datatimez (`DTZ`)
    "T10",  # flake8-debugger (`T10`)
    "EM",   # flake8-errmsg (`EM`)
    "FA",   # flake8-future-annotations (`FA`)
    "ISC",  # flake8-implicit-str-concat (`ISC`)
    "ICN",  # flake8-import-conventions (`ICN`)
    "PIE",  # flake8-pie (`PIE`)
    "PT",   # flake8-pytest-style (`PT`)
    "RSE",  # flake8-raise (`RSE`)
    "RET",  # flake8-return (`RET`)
    "SLF",  # flake8-self (`SLF`)
    "SIM",  # flake8-simplify (`SIM`)
    "TID",  # flake8-tidy-imports (`TID`)
    "TCH",  # flake8-type-checking (`TCH`)
    "INT",  # flake8-gettext (`INT`)
    "ARG",  # flake8-unsused-arguments (`ARG`)
    "PTH",  # flake8-use-pathlib (`PTH`)
    "TD",   # flake8-todos (`TD`)
    "FIX",  # flake8-fixme (`FIX`)
    # "LOG",  # flake8-logging (`LOG`) -> Rules included in the preview version of RUFF. It may be added in the future, but for now, disable it.

    "ERA",  # eradicate (`ERA`)
    "PD",   # pandas-vet (`PD`)
    "PGH",  # pygrep-hooks (`PGH`)
    "TRY",  # tryceratos (`TRY`)
    "FLY",  # flynt (`FLY`)
    "NPY",  # NumPy-specific rules (`NPY`)
    "PERF", # Perflint (`PERF`)
    # "FURB", # refurb (`FURB`) -> Rules included in the preview version of RUFF. It may be added in the future, but for now, disable it.
    "RUF",  # Ruff-specific rules (`RUF`)
]

ignore = [
    # pydocstyle
    # On top of the Google convention, disable `D417`, which requires
    # documentation for every function parameter.
    "D417",     # Missing argument descriptions in the docstring

    "D107",     # Missing docstring in `__init__`
    "D105",     # Missing docstring in magic method

    # flake8-annotations
    "ANN002",   # Missing type annotation for *args
    "ANN003",   # Missing type annotation for **kwargs

    "ANN204",   # Missing return type annotation for special method `__init__`

    "ARG002",   # Unused method argument -> some function cannot use argument

    "COM812",   # Missing trailing comma -> conflicts with ISC001

    # flake8-type-checking
    "TC001",    # typing-only-first-party-import, Sometimes this causes an incorrect error.
    # flake8-fixme
    "FIX002",   # line-contains-todo

    "E731",     # Do not assign a `lambda` expression, use a `def`
    "TD003",    # Missing issue link on the line following this TODO
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
# unfixable = [
#     "F401",     # disable autofix for unused imports
# ]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "tests/assets",

    # Ruff complains about it without providing details about the reason.
    "tests/regression/*.py",

    # Mostly borrowed from jsonargparse codebase
    "src/getitune/core/utils/jsonargparse.py",

    # Sphinx auto-generated files
    "docs/source/conf.py",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = [
    # Label info objects
    "getitune.types.label.LabelInfo",
    "getitune.types.label.HLabelInfo",
    "getitune.types.label.SegLabelInfo",
    "getitune.types.label.NullLabelInfo",

    # Config objects
    "getitune.config.data.TileConfig",
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 20

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str", "bytes", "int", "float"]
max-args = 20
max-branches = 50
max-statements = 150
max-returns = 10

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
# Copyright \\(C\\) (\\d{4}(-\\d{4})?) Intel Corporation
# SPDX-License-Identifier: Apache-2\\.0
"""

[tool.ruff.lint.per-file-ignores]
# Declare an additional exclude rule for test code
"tests/**/*.py" = [
    "S101",     # pytest-style allows `assert` statements in tests.
    "S603",     # Allow for untrusted input in tests.
    "SLF001",   # We sometimes need to inspect private functions for testing.
    "TCH003",   # It doesn't seem necessary to use TYPE_CHECKING in tests.
    "PT004",    # fixture ignore type returning.
    "E501",     # Test skips lines that are too long.
    "ANN001",   # Skip annotation type hint in test codes
    "ANN201",   # Skip return type hint in test codes
    "D",     # Test skips missing docstring argument with magic (fixture) methods.
    "ARG001",   # Some arguments are passed for executing fixture
    "PT019",    # False positive on `@patch`-injected mock parameters, which aren't pytest fixtures.
]
"src/getitune/**/*.py" = [
    "ERA001",
]
"src/getitune/core/config/**/*.py" = [
    "UP007"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "gpu",  # mark tests which require NVIDIA GPU
    "cpu",
    "xpu",  # mark tests which require Intel dGPU,
    "network",  # mark tests that perform real network I/O; skipped by default unless --run-network is passed
]
python_files = "tests/**/*.py"

[tool.pyrefly]
python-version = "3.11.0"
project-includes = ["src/getitune/**/*.py*", "tests/**/*.py*"]
ignore-missing-imports = ["*"]
