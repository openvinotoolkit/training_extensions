# OTX Benchmark Manifest — defines WHAT to run
#
# The manifest declares models, dataset references, scenarios, and
# regression criteria for each task.  The runner iterates over the
# cross-product (model × dataset × scenario × seed) after applying
# any runtime filters.
version: 1
defaults:
  num_seeds: 2
  eval_upto: optimize
  deterministic: false # Setting to true is extremely slow for certain models
  rotation:
    extended_groups: 2
experiments:
  classification/multi_class_cls:
    models:
      - name: dino_v2
        priority: core
      - name: vit_tiny
        priority: core
      - name: mobilenet_v3_large
        priority: core
      - name: efficientnet_b3
        priority: deferred
      - name: efficientnet_v2
        priority: extended
      - name: efficientnet_b0
        priority: extended
      - name: yolo26_n_cls
        priority: core
      - name: yolo26_s_cls
        priority: deferred
      - name: yolo26_m_cls
        priority: deferred
      - name: yolo26_l_cls
        priority: deferred
      - name: yolo26_x_cls
        priority: extended
    datasets:
      - paddy_disease
      - chest_ct
      - aircraft
      - flowers102
      - food41
    criteria:
      accuracy_metric: f1-score
      thresholds:
        "training:val/{metric}": { compare: ">=", margin: 0.10 }
        "torch:test/{metric}": { compare: ">=", margin: 0.10 }
        "export:test/{metric}": { compare: ">=", margin: 0.10 }
        "training:train/iter_time": { compare: "<=", margin: 0.10 }
        "training:gpu_mem": { compare: "<=", margin: 0.10 }
        "training:ram_mem": { compare: "<=", margin: 0.10 }
        "torch:test/gpu_mem": { compare: "<=", margin: 0.10 }
        "torch:test/ram_mem": { compare: "<=", margin: 0.10 }
        "torch:test/latency": { compare: "<=", margin: 0.15 }
  classification/multi_label_cls:
