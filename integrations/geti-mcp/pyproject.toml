[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geti-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Geti application REST API"
authors = [
    { name = "Intel Corporation" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"

# Deliberately kept minimal: this package talks to Geti over HTTP only and must not
# pull in the backend's or the training library's heavyweight runtime dependencies.
dependencies = [
    "mcp~=2.2.0",
    "httpx~=0.28.1",
    "pydantic~=2.13.5",
    "pillow~=12.3.0",
]

[project.scripts]
geti-mcp = "geti_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-asyncio~=1.3.0",
    # Validates the fake backend's payloads against Geti's OpenAPI contract. Also pulled in
    # transitively by mcp, but the contract tests depend on it directly.
    "jsonschema~=4.26.0",
]
lint = [
    "ruff==0.11.13",
    "pyrefly~=1.2.0",
]

[tool.uv]
default-groups = ["dev", "lint"]
required-version = "~=0.10.4"

[tool.hatch.build.targets.wheel]
packages = ["src/geti_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ARG", "E", "F", "I", "N", "UP", "YTT", "ASYNC", "S", "COM", "C4", "FA", "PIE", "PYI", "Q", "RSE", "RET", "SIM",
    "TID", "PL", "RUF", "C90", "D103", "ANN001", "ANN201", "ANN205"]
ignore = ["ARG002", "N801", "N805", "N806", "N807", "N818", "COM812", "RET503", "SIM108", "SIM105", "PLR2004",
    "RUF010", "RUF012", "CPY001", "PLE1205", "UP037"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["S", "ANN", "D", "ARG", "PLR", "ASYNC"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-args = 8

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
python-version = "3.11.0"
project-includes = ["src/**/*.py", "tests/**/*.py"]
# Tests import `tests.conftest`, so the package root must be a search path alongside `src`.
search-path = ["src", "."]
ignore-missing-imports = ["*"]
