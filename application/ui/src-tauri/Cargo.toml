[package]
name = "geti_ui"
version = "3.2.0"
description = "Geti UI"
authors = ["Intel"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.3"

# Desktop-only: guarantees a single running instance so no two
# backends are spawned competing for the same TCP port and SQLite database.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.3.4"

# Windows-only: Job Objects + console control events for a reliable, graceful
# side-car shutdown, and the WebView2 COM interfaces needed to observe
# `ProcessFailed` (Evergreen runtime updates / GPU crashes) instead of dying.
# Versions are pinned to the ones tauri 2.11 / wry 0.55 already resolve to, so
# no duplicate native crates end up in the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
webview2-com = "0.38"

