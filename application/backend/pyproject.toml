[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geti"
dynamic = ["version"]
description = "Geti"
authors = [
    { name = "Intel Corporation" },
]
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi[standard]~=0.138.1",
    "pillow~=12.0",
    "python-multipart~=0.0.20",
    "uvicorn~=0.38.0",
    "psutil~=7.1.3",
    "pyyaml~=6.0.3",
    "watchdog==6.0.0",
    "sqlalchemy~=2.0.44",
    "alembic~=1.17.2",
    "aiofiles==25.1.0",
    "pydantic-settings~=2.14.2",
    "aiortc~=1.14.0",
    "datumaro[experimental]~=1.13.10",
    "defusedxml~=0.7.1",
    "scikit-learn~=1.7.2",
    "faster-coco-eval~=1.7.0",
    "scikit-multilearn~=0.2.0",
    "loguru~=0.7.3",
    "sse-starlette~=3.0.3",
    "cv2-enumerate-cameras==1.3.3",
    "opencv-python-headless~=4.13.0",
    "polars~=1.37.0",
    "optree~=0.19.0",
    "av~=16.1.0",
    "starlette~=1.3.1",
    "hypercorn~=0.18.0",
    "safetensors~=0.8.0",
]

[project.optional-dependencies]
# Choose one of the following training backends:
# - cpu: only CPU training (no GPU support)
# - xpu: support training on compatible Intel GPUs
# - cuda: support training on compatible NVIDIA GPUs
cpu = ["getitune[cpu,ultralytics]"]
xpu = ["getitune[xpu,ultralytics]"]
cuda = ["getitune[cuda,ultralytics]"]

mqtt = [
    "paho-mqtt~=2.1.0",
]
installer = ["pyinstaller~=6.19.0"]

[dependency-groups]
dev = [
    "behave~=1.3.3",
    "pytest~=9.0.3",
    "pytest-asyncio~=1.3.0",
    "testcontainers~=4.14.1",
    "time-machine~=2.19.0",
]
lint = [
    "ruff==0.11.13",
    "import-linter==2.3",
    "types-aiofiles~=25.1.0",  # should match aiofiles version
    "types-requests~=2.32.4",
    "types-pyyaml~=6.0.12",  # should match pyyaml version
    "pyrefly~=1.2.0",
]

[tool.uv]
default-groups = ["dev", "lint"]
required-version = "~=0.10.4"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "xpu" },
        { extra = "cuda" },
    ],
    # redeclare library conflicts to workaround bug with uv dependency resolution
    # For details, see: https://github.com/astral-sh/uv/issues/9942
    [
        { package = "getitune", extra = "cpu" },
        { package = "getitune", extra = "xpu" },
        { package = "getitune", extra = "cuda" },
    ],
]

exclude-dependencies = [
    # We already depend on 'opencv-python-headless', so installing 'opencv-python' (the version with GUI dependencies)
    # may cause conflicts and waste disk space.
    "opencv-python",
]
override-dependencies = [
    # Bypass the unnecessarily strict version requirement of 'opencv-python-headless' set by 'roboflow'
    "opencv-python-headless~=4.11",
    # roboflow hard-pins idna==3.7; allow newer versions
    "idna>=3.15",
    # torch==2.12.1 caps setuptools<82 but version lower than 83.0 have vulnerabilities of moderate severity
    "setuptools>=83.0",
]
constraint-dependencies = [
    "torch==2.12.*",
]

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
getitune = { path = "../../library", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".import_linter_cache", ".local", "logs"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ARG", "E", "F", "I", "N", "UP", "YTT", "ASYNC", "S", "COM", "C4", "FA", "PIE", "PYI", "Q", "RSE", "RET", "SIM",
    "TID", "PL", "RUF", "C90", "D103", "ANN001", "ANN201", "ANN205"]
ignore = ["ARG002", "N801", "N805","N806","N807", "N818", "COM812", "RET503", "SIM108", "SIM105", "PLR2004",
    "RUF010", "RUF012", "CPY001", "PLE1205"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["S", "ANN", "D", "ARG", "PLR", "ASYNC"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-args=7

[tool.importlinter]
root_package = "app"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "App Main Vertical"
type = "layers"
id = "main_app"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.db",
]
ignore_imports = [
    # Deliberate exception: on_complete() reconciles a training status stuck at IN_PROGRESS
    # after a job crash, as a safety net independent of the trainer process itself.
    "app.models.jobs.training_job -> app.services",
]

[[tool.importlinter.contracts]]
name = "Internal API"
type = "layers"
id = "api"
layers = [
    "app.api.routers",
    "app.api.schemas",
    "app.api.dependencies",
]

[[tool.importlinter.contracts]]
name = "Core Module"
type = "layers"
id = "core_module"
layers = [
    "app.core.jobs",
    "app.core.run",
    "app.core.models",
    "app.core.logging",
]

[[tool.importlinter.contracts]]
name = "Models"
type = "layers"
id = "views_models"
layers = [
    "app.api.schemas",
    "app.models",
    "app.core.models",
]

[[tool.importlinter.contracts]]
name = "Service-Models-Utils"
type = "layers"
id = "service_models_utils"
layers = [
    "app.services",
    "app.models",
    "app.utils",
]
ignore_imports = [
    # Deliberate exception: on_complete() reconciles a training status stuck at IN_PROGRESS
    # after a job crash, as a safety net independent of the trainer process itself.
    "app.models.jobs.training_job -> app.services",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.pyrefly]
python-version = "3.13.0"
project-includes = ["app/**/*.py*", "pyinstaller/**/*.py*", "tests/**/*.py*"]
ignore-missing-imports = ["*"]
