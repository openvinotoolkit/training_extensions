id: image-classification-yolo26-m
name: YOLO26-M
license: AGPL-3.0

pretrained_weights:
  source: direct_link
  url: https://huggingface.co/Ultralytics/YOLO26/resolve/main/yolo26m-cls.pt
  mirror_url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26m-cls.pt
  sha_sum: "9f6546f33a70d910e2cd6dcca5265c4617b5670b19a1f287c39e99258bade01a"

description: "YOLO26-M is the medium Ultralytics YOLO26 classification model. It targets higher accuracy while using the Geti Tune data pipeline for preprocessing and dataset handling."
stats:
  gigaflops: 4.9
  trainable_parameters: 11.6
  benchmark_metrics:
    imagenet_top1_accuracy: 78.1
    imagenet_top5_accuracy: 94.2

hyperparameters:
  training:
    learning_rate: 0.000714
    weight_decay: 0.0005
    max_epochs: 90
    early_stopping:
      enable: false
    batch_size: 16
    input_size_width: 224
    input_size_height: 224
    scheduler:
      type: cosine_annealing
      warmup:
        enable: true
        epochs: 3
    gradient_clip:
      enable: true
      max_grad_norm: 10.0
    gradient_accumulation:
      enable: false
  dataset_preparation:
    augmentation:
      random_resize_crop:
        crop_ratio_range:
          - 0.5
          - 1.0
      random_erasing:
        enable: true
        probability: 0.4
