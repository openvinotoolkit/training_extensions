name: Cleanup Old Application Container Images

# Deletes old geti-cpu / geti-xpu / geti-cuda container image versions from GHCR,
# while always retaining release and release-candidate (RC) images.
#
# This workflow delegates to the shared `cleanup-images` composite action in the
# geti-ci repository. See:
# https://github.com/open-edge-platform/geti-ci/tree/main/actions/cleanup-images
#
# Retention rules:
# - Release images (tags matching semver "X.Y.Z", e.g. 3.0.0) are NEVER deleted.
# - Release-candidate images (tags matching "X.Y.ZrcN", e.g. 3.0.0rc0) are
#   NEVER deleted.
# - The "latest" tag is NEVER deleted.
# - Among the remaining versions (dev/daily builds and untagged versions) the
#   most recent `min_versions_to_keep` are kept; older ones are deleted.
#
# RC images for a specific released version are instead removed automatically
# once that version is promoted, see remove-rc-app-images.yml (invoked from
# promote-rc-app-release.yml).
#
# Supports a dry-run mode (default) that previews deletions without removing
# anything.

on:
  workflow_dispatch:
    inputs:
      min_versions_to_keep:
        description: "Number of most recent non-release image versions to keep per package"
        required: false
        type: number
        default: 10
      dry_run:
        description: "Preview deletions without removing image versions"
        required: false
        type: boolean
        default: true
  schedule:
    # Run weekly on Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"

permissions: {} # No permissions by default

jobs:
  cleanup-old-images:
    name: Delete old GHCR application images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Cleanup old container images
        uses: open-edge-platform/geti-ci/actions/cleanup-images@164479fa1091ae69e1fa7c2be65eaecdf7f3cf66 # cleanup-images/v0.1.1
        with:
          packages: |
            geti-cpu
            geti-xpu
            geti-cuda
          min-versions-to-keep: ${{ inputs.min_versions_to_keep || 10 }}
          # Scheduled runs delete for real; manual dispatch previews by default.
          dry-run: ${{ github.event_name != 'schedule' && inputs.dry_run && 'true' || 'false' }}
