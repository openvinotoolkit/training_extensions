name: Timm Training Smoke Test

on:
  schedule:
    - cron: "0 17 * * 5" # Every Friday at 17:00 UTC
  workflow_dispatch:

permissions: {} # No permissions by default on workflow level

concurrency:
  group: timm-training-smoke-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build docker image and run timm training smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull the buildcache layer from GHCR
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/open-edge-platform/geti-cpu
          tags: |
            type=raw,value=timm-smoke-${{ github.run_id }}

      - name: Build Docker image (cpu)
        id: docker_build
        uses: ./.github/actions/docker-build
        with:
          device: cpu
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: "false" # keep local-only; no need to publish a throwaway smoke-test tag
          use-cache: "true"

      - name: Install Python, uv and Just
        uses: ./.github/actions/install-common-deps
        with:
          uv-version-file: application/backend/pyproject.toml

      - name: Prepare venv and install Python dependencies
        working-directory: application/backend
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: just venv

      - name: Run timm training smoke tests (against running docker build)
        working-directory: application/backend
        env:
          IMAGE_TAG: ${{ steps.docker_build.outputs.image-name }}
          RUNNER: docker
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          export DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          just test-bdd-timm

      - name: Upload timm training failures report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timm-training-failures
          path: application/backend/tests/bdd/timm_training_failures.json
          if-no-files-found: ignore
          retention-days: 30

  check-existing-issue:
    name: Check for existing failure issue
    runs-on: ubuntu-latest
    needs: build-and-test
    if: failure()
    permissions:
      issues: read
    outputs:
      issue_exists: ${{ steps.check.outputs.issue_exists }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check for existing open issue
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'timm-smoke-failure,automated',
              state: 'open',
            });
            core.setOutput('issue_exists', issues.data.length > 0 ? 'true' : 'false');

  create-issue-on-failure:
    name: Create issue on scheduled workflow failure
    runs-on: ubuntu-latest
    needs: [build-and-test, check-existing-issue]
    if: failure() && needs.check-existing-issue.outputs.issue_exists == 'false'
    permissions:
      issues: write
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Create GitHub Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Scheduled Check] Timm training smoke test failed - ${new Date().toISOString().split('T')[0]}`,
              body: `One or more timm architecture flavors failed to train.\n\n**Run:** ${runUrl}\n\nDownload the \`timm-training-failures\` artifact for the per-architecture stack traces.`,
              labels: ['timm-smoke-failure', 'automated'],
            });
