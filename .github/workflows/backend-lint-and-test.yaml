name: Geti server checks
on:
  merge_group:
    branches:
      - develop
      - release/**
  push:
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {} # No permissions by default on workflow level

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Determines if workflow should execute based on event type and changed paths
  # If push or workflow_dispatch -> always run
  # If PR or merge_group -> run only if files in specified paths changed
  check_paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - application/backend/**
              - library/**
              - .github/workflows/backend-lint-and-test.yaml
              - .github/actions/install-common-deps/**
              - '!**/*.md'
              - '!**/docs/**'

  python-checks:
    strategy:
      matrix:
        os: ["ubuntu", "windows"]
    # Use more descriptive job name for better visibility in CI results
    name: python-${{ matrix.os }}-checks
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-latest' || 'windows-latest' }}
    needs: check_paths
    if: needs.check_paths.outputs.run_workflow == 'true'
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden the runner (audit all outbound calls)
        if: matrix.os == 'ubuntu'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - *checkout

      - name: Install Python, uv and Just
        uses: ./.github/actions/install-common-deps
        with:
          uv-version-file: application/backend/pyproject.toml # Install the uv version specified in pyproject.toml

      - name: Install OpenCV dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0

      - name: Prepare venv and install Python dependencies
        working-directory: application/backend
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # Skip downloading LFS files for deps installed via git
        run: just venv

      - name: Run linters and type-checkers
        if: matrix.os == 'ubuntu'
        working-directory: application/backend
        run: just lint

      - name: Validate Alembic migrations
        if: matrix.os == 'ubuntu'
        working-directory: application/backend
        run: just check-migrations

      - name: Run unit tests
        working-directory: application/backend
        run: just test-unit

      - name: Run integration tests
        working-directory: application/backend
        run: just test-integration

  timm-catalog-version-check:
    name: timm-catalog-version-check
    runs-on: ubuntu-latest
    needs: check_paths
    if: needs.check_paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - name: Verify snapshot timm_version matches the pinned dependency
        run: |
          SNAPSHOT="application/backend/app/supported_models/timm_catalog_snapshot.json"
          if [[ ! -f "$SNAPSHOT" ]]; then
            echo "::error::${SNAPSHOT} not found. Run 'just gen-timm-catalog' from application/backend/." >&2
            exit 1
          fi

          PINNED_VERSION=$(python3 -c "import pathlib,re; m=re.search(r'\"timm==([^\"]+)\"', pathlib.Path('library/pyproject.toml').read_text(encoding='utf-8')); print(m.group(1) if m else '')")
          if [[ -z "$PINNED_VERSION" ]]; then
            echo "::error::Could not parse pinned timm version from library/pyproject.toml." >&2
            exit 1
          fi

          SNAPSHOT_VERSION=$(python3 -c "import json; print(json.load(open('${SNAPSHOT}'))['timm_version'])")

          echo "Pinned timm version:   ${PINNED_VERSION}"
          echo "Snapshot timm_version: ${SNAPSHOT_VERSION}"

          if [[ "$PINNED_VERSION" != "$SNAPSHOT_VERSION" ]]; then
            echo "::error::${SNAPSHOT} was generated with timm==${SNAPSHOT_VERSION}, but library/pyproject.toml pins timm==${PINNED_VERSION}. Regenerate with 'just gen-timm-catalog' from application/backend/." >&2
            exit 1
          fi

  required_check:
    name: Required Check backend-lint-and-test
    needs:
      - check_paths
      - python-checks
      - timm-catalog-version-check
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - *harden-runner

      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
