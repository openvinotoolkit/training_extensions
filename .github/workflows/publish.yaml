name: Build and upload to PyPI

on:
  workflow_dispatch: # run on request (no need for PR)
  push:
    tags:
      - 'lib/v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+' # RC: lib/v0.1.0rc1
      - 'lib/v[0-9]+\.[0-9]+\.[0-9]+' # Release: lib/v0.1.0, lib/v0.1.2

permissions: {} # No permissions by default

jobs:
  build:
    name: Build & publish package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required by trusted publisher
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist libraries/getitune/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-sdist
          path: libraries/getitune/dist/*.tar.gz

      - name: Build wheel
        run: python -m build --wheel libraries/getitune/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-wheel
          path: libraries/getitune/dist/*.whl

      # Determine where to publish the package distribution to PyPI or TestPyPI
      - name: Check tag
        id: check-tag
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        with:
          text: ${{ github.ref }}
          regex: '^refs/tags/lib/v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Publish package distributions to PyPI
        if: ${{ steps.check-tag.outputs.match != '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: libraries/getitune/dist

      - name: Publish package distributions to TestPyPI
        if: ${{ steps.check-tag.outputs.match == '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          packages-dir: libraries/getitune/dist
