name: NPM Audit Fix

on:
  schedule:
    - cron: "0 3 2,16 * *"
  workflow_dispatch:
    inputs:
      force_fix:
        description: "Run npm audit fix --force (includes breaking changes)"
        required: false
        default: false
        type: boolean
permissions: {} # No permissions by default on workflow level

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code

    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: application/ui/.nvmrc

      # `npm audit fix` resolves new versions, so it must honor the
      # `min-release-age` setting in application/ui/.npmrc, which requires
      # npm >= 11.14.0. The npm shipped with the pinned Node version may be
      # older, so install a compatible npm globally first. There is no
      # lockfile-based way to pin npm itself (it must exist before any
      # lockfile-aware install can run), so the version is hardcoded instead.
      - name: Ensure npm supports min-release-age
        run: npm i -g npm@11.14.0 # zizmor: ignore[adhoc-packages]

      - name: Install dependencies
        working-directory: application/ui
        run: npm ci

      - name: Display audit report
        working-directory: application/ui
        continue-on-error: true
        run: |
          npm audit || true

      - name: Run npm audit fix (safe mode)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.force_fix != 'true' }}
        working-directory: application/ui
        continue-on-error: true
        run: npm audit fix --package-lock-only || echo "Some issues could not be auto-fixed"

      - name: Run npm audit fix (force mode)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_fix == 'true' }}
        working-directory: application/ui
        continue-on-error: true
        run: npm audit fix --force || true

      - name: Check for changes
        id: check-changes
        working-directory: application/ui
        run: |
          if git diff --quiet package-lock.json package.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # GitHub App token is required to trigger other workflows (GITHUB_TOKEN cannot trigger workflows)
      - name: Get token
        if: steps.check-changes.outputs.changed == 'true'
        id: get-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PEM }}
          repositories: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}
          # Repository permissions: only what's needed to push a branch and open a PR
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR if lockfile changed
        if: steps.check-changes.outputs.changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          author: oep-renovate[bot] <212772560+oep-renovate[bot]@users.noreply.github.com>
          committer: oep-renovate[bot] <212772560+oep-renovate[bot]@users.noreply.github.com>
          commit-message: "fix(deps): npm audit fixes [security]"
          title: "fix(deps): npm audit fixes [security]"
          body: |
            This PR was automatically created to update NPM dependencies with:
            ${{ github.event.inputs.force_fix == 'true' && '`npm audit fix --force`' || '`npm audit fix --package-lock-only`' }}
          branch: "npm-audit-fix-${{ github.run_id }}"
          base: develop
          delete-branch: true
          reviewers: sys-geti

      # Automerge is restricted to safe-mode PRs (no --force)
      - name: Enable auto-merge for safe mode PR
        if: ${{
          steps.check-changes.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || github.event.inputs.force_fix != 'true') &&
          vars.RENOVATE_AUTOMERGE_ENABLED != 'false'
          }}
        env:
          GH_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge --auto --squash \
            --repo "$REPOSITORY" \
            "$PR_NUMBER"
