name: Pretrained Weights URL Health Check

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily, after the main daily.yml at 02:00
  workflow_dispatch:

permissions: {} # No permissions by default on workflow level

jobs:
  check-weights-urls:
    name: Check pretrained weights URLs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      failure_count: ${{ steps.probe.outputs.failure_count }}
      failures: ${{ steps.probe.outputs.failures }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Probe pretrained weights URLs
        id: probe
        run: |
          set -euo pipefail
          MANIFESTS_DIR="application/backend/app/supported_models/manifests"

          probe_url() {
            local model_id="$1" model_name="$2" url="$3"
            local result code time_s bytes_dl url_eff curl_exit
            # Capture status, timing, bytes received, and final URL after redirects
            result=$(curl --silent --output /dev/null \
                          --write-out "%{http_code}|%{time_total}|%{size_download}|%{url_effective}" \
                          --range 0-65535 --max-filesize 131072 --location \
                          --max-time 30 --connect-timeout 10 \
                          --retry 3 --retry-delay 2 "$url") && curl_exit=0 || curl_exit=$?
            IFS='|' read -r code time_s bytes_dl url_eff <<< "$result"
            if [[ "$code" =~ ^(200|206)$ ]]; then
              printf 'OK   %-45s  http=%s  %.2fs  %d B  -> %s\n' \
                "$model_name" "$code" "$time_s" "$bytes_dl" "$url_eff"
            elif [[ "$curl_exit" -eq 63 && "$code" =~ ^(200|206)$ ]]; then
              # exit 63 = CURLE_FILESIZE_EXCEEDED: response exceeded --max-filesize (typically when Range is not honoured)
              printf 'OK   %-45s  http=%s  %.2fs  (range unsupported, capped)  -> %s\n' \
                "$model_name" "$code" "$time_s" "$url_eff"
            else
              printf 'FAIL %-45s  http=%s  %.2fs  %s\n' \
                "$model_name" "$code" "$time_s" "$url"
              { flock 9; printf '%s\t%s\t%s\t%s\n' "$model_id" "$model_name" "$url" "$code" \
                >> /tmp/failures.tsv; } 9>/tmp/failures.lock
            fi
          }
          export -f probe_url

          # Negative self-test: a nonexistent GCS key in a known-public bucket must be detected as failed
          probe_url "__self_test__" "[self-test]" \
            "https://storage.googleapis.com/rfdetr/this-file-does-not-exist-geti-ci-test.pth"
          if ! grep -q "__self_test__" /tmp/failures.tsv 2>/dev/null; then
            echo "::error::Self-test failed: probe_url did not detect a broken URL"
            exit 1
          fi
          : > /tmp/failures.tsv  # clear self-test entry before real probing

          # Process substitution keeps the while loop in the main shell so RUNNING stays in scope
          echo "Format: [OK|FAIL]  <model>  http=<code>  <time>  <bytes received>  -> <final URL after redirects>"
          RUNNING=0
          TOTAL=0
          while IFS=$'\t' read -r model_id model_name url; do
            # Throttle before starting to never exceed 8 concurrent jobs
            while (( RUNNING >= 8 )); do
              wait -n 2>/dev/null || true
              RUNNING=$(( RUNNING - 1 ))
            done
            probe_url "$model_id" "$model_name" "$url" &
            RUNNING=$(( RUNNING + 1 ))
            TOTAL=$(( TOTAL + 1 ))
          done < <(find "$MANIFESTS_DIR" -name '*.yaml' ! -name 'base.yaml' | sort | \
                   xargs yq -r '[.id, .name, .pretrained_weights.url] | @tsv')
          wait

          FAILED=$(wc -l < /tmp/failures.tsv 2>/dev/null | tr -d '[:space:]' || echo 0)
          echo "Probed ${TOTAL} URL(s): $(( TOTAL - FAILED )) OK, ${FAILED} failed"

          if [[ -s /tmp/failures.tsv ]]; then
            echo "failure_count=${FAILED}" >> "$GITHUB_OUTPUT"
            { echo "failures<<EOF"; cat /tmp/failures.tsv; echo "EOF"; } >> "$GITHUB_OUTPUT"
            {
              echo "## :x: Pretrained weights URL health check: ${FAILED} failure(s)"
              echo ""
              echo "| Model | URL | HTTP Status |"
              echo "|-------|-----|-------------|"
              while IFS=$'\t' read -r _id name url code; do
                echo "| ${name} | ${url} | \`${code}\` |"
              done < /tmp/failures.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "failure_count=0" >> "$GITHUB_OUTPUT"
          echo "## :white_check_mark: Pretrained weights URL health check: all URLs reachable" \
            >> "$GITHUB_STEP_SUMMARY"

  check-existing-issue:
    name: Check for existing weights-health issue
    runs-on: ubuntu-latest
    needs: check-weights-urls
    if: failure()
    permissions:
      issues: read
    outputs:
      issue_exists: ${{ steps.check.outputs.issue_exists }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check for existing open issue
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.info('Searching for existing open issues with labels: weights-health, automated');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weights-health,automated',
              state: 'open',
            });

            core.info(`Found ${issues.data.length} open issue(s) with matching labels`);

            const matchingIssues = issues.data.filter(i =>
              i.title.includes('[Weights URL health check]')
            );
            if (matchingIssues.length > 0) {
              core.info(`Found ${matchingIssues.length} matching issue(s):`);
              for (const issue of matchingIssues) {
                core.info(`  - #${issue.number} - "${issue.title}" (${issue.html_url})`);
              }
            } else {
              core.info('No existing issue found, a new one will be created');
            }
            core.setOutput('issue_exists', matchingIssues.length > 0 ? 'true' : 'false');

  create-issue-on-failure:
    name: Create issue on weights health check failure
    runs-on: ubuntu-latest
    needs:
      - check-weights-urls
      - check-existing-issue
    if: failure() && needs.check-existing-issue.outputs.issue_exists == 'false'
    permissions:
      issues: write # Permission to create issues
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Create GitHub Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILURES: ${{ needs.check-weights-urls.outputs.failures }}
        with:
          script: |
            const workflowRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];

            const rows = (process.env.FAILURES || '').trim().split('\n').filter(Boolean);
            const tableRows = rows.map(row => {
              const [, name, url, code] = row.split('\t');
              return `| ${name} | ${url} | \`${code}\` |`;
            }).join('\n');
            const table = rows.length > 0
              ? `| Model | URL | HTTP Status |\n|-------|-----|-------------|\n${tableRows}`
              : `_No structured failure data — see the [workflow run](${workflowRunUrl}) for details._`;

            const body = [
              '## Bug Report',
              '',
              '### Unreachable URLs',
              '',
              table,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Weights URL health check] Unreachable pretrained weights URLs - ${today}`,
              body,
              labels: ['weights-health', 'automated'],
              assignees: ['leoll2'],
              type: 'Bug',
            });
