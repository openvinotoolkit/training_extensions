backend: huggingface
task: MULTI_LABEL_CLS
model:
  class_path: getitune.backend.huggingface.models.dinov3_classification.HFDinov3MultilabelClsModel
  init_args:
    checkpoint: timm/convnext_tiny.dinov3_lvd1689m
    pretrained: true
    input_size: [224, 224]
engine:
  device: auto
training:
  max_epochs: 90
  batch: 64
  learning_rate: 0.0001
  precision: bf16-mixed
  patience: 10
  optim: adamw_torch
  weight_decay: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.11
  max_grad_norm: 1.0
data: ../../_base_/data/classification.yaml
