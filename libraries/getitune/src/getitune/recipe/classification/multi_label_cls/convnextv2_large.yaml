backend: huggingface
task: MULTI_LABEL_CLS
model:
  class_path: getitune.backend.huggingface.models.classification.HFMultilabelClsModel
  init_args:
    checkpoint: facebook/convnextv2-large-1k-224
    pretrained: true
    input_size: [224, 224]
engine:
  device: auto
training:
  max_epochs: 90
  batch: 32
  learning_rate: 0.00005
  precision: bf16-mixed
  patience: 10
  optim: adamw_torch
  weight_decay: 0.05
  lr_scheduler_type: cosine
  warmup_ratio: 0.11
  max_grad_norm: 1.0
data: ../../_base_/data/classification.yaml
